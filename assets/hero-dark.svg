<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250"
     role="img" aria-label="Carlos Moises - desenvolvedor full stack, sistemas em producao" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Carlos Moises - desenvolvedor full stack</title>

  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#446DF7" stop-opacity=".55"/>
      <stop offset="45%" stop-color="#2BD9A0" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#446DF7" stop-opacity=".10"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>

    <clipPath id="card">
      <rect x="8" y="8" width="984" height="234" rx="18"/>
    </clipPath>

    <clipPath id="revealTech">
      <rect id="rTech" x="40" y="138" width="480" height="24"/>
    </clipPath>

    <clipPath id="revealPrompt">
      <rect id="rPrompt" x="40" y="184" width="560" height="26"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

    .name   { opacity: 1; animation: nameIn 14s ease-out infinite; }
    #rTech   { animation: typeTech 14s steps(1, end) infinite; }
    #rPrompt { animation: typePrompt 14s linear infinite; }
    .caret  { animation: caretBlink .9s steps(1, end) infinite; }
    .pulse  { animation: pulse 2.6s ease-out infinite; }
    .drift  { animation: drift 22s ease-in-out infinite alternate; }

    @keyframes nameIn {
      0%, 2%   { opacity: 0; }
      9%, 100% { opacity: 1; }
    }
    @keyframes typeTech {
      0%, 8%    { width: 0px; }
      9%        { width: 104px; }
      11%       { width: 190px; }
      13%       { width: 276px; }
      15%, 100% { width: 480px; }
    }
    @keyframes typePrompt {
      0%, 20%    { width: 0px; }
      36%, 100%  { width: 560px; }
    }
    @keyframes caretBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse {
      0%   { r: 4px;  opacity: .55; }
      75%  { r: 15px; opacity: 0; }
      100% { r: 15px; opacity: 0; }
    }
    @keyframes drift {
      from { transform: translate(0px, 0px); }
      to   { transform: translate(60px, -26px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .name, #rTech, #rPrompt, .caret, .pulse, .drift { animation: none; }
    }
  </style>

  <!-- base -->
  <rect x="8" y="8" width="984" height="234" rx="18" fill="#0B1020"/>

  <g clip-path="url(#card)">
    <g class="drift">
      <ellipse cx="180" cy="40" rx="180" ry="110" fill="#446DF7" opacity="0.22" filter="url(#soft)"/>
      <ellipse cx="880" cy="250" rx="200" ry="120" fill="#2BD9A0" opacity="0.14" filter="url(#soft)"/>
    </g>
    <!-- barra de status -->
    <rect x="8" y="8" width="984" height="42" fill="#101736"/>
    <line x1="8" y1="50" x2="992" y2="50" stroke="#1E2A4E" stroke-width="1"/>
  </g>

  <!-- barra de status: conteudo -->
  <text class="mono" x="32" y="34" font-size="12.5" fill="#8090B8">carlosmoises.netlify.app</text>
  <g>
    <rect x="760" y="17" width="200" height="24" rx="12" fill="#0B1020" stroke="#1E2A4E"/>
    <circle cx="777" cy="29" r="3.5" fill="#2BD9A0"/>
    <text class="mono" x="789" y="33" font-size="11.5" fill="#E8EDFF">aberto a oportunidades</text>
  </g>

  <!-- coluna esquerda -->
  <text class="sans name" x="40" y="118" font-size="52" font-weight="800"
        letter-spacing="-1.4" fill="#E8EDFF">Carlos Mois&#233;s</text>

  <g clip-path="url(#revealTech)">
    <text class="mono" x="40" y="156" font-size="16" fill="#446DF7"
          letter-spacing=".2">react  next  node  java  spring  postgres</text>
  </g>

  <g clip-path="url(#revealPrompt)">
    <text class="mono" x="40" y="204" font-size="15" fill="#8090B8">$ <tspan fill="#E8EDFF">construo sistemas que entram em produ&#231;&#227;o e ficam l&#225;</tspan><tspan class="caret" fill="#446DF7">&#9608;</tspan></text>
  </g>

  <!-- divisor -->
  <line x1="612" y1="78" x2="612" y2="206" stroke="#1E2A4E" stroke-width="1"/>

  <!-- coluna direita: o que esta no ar -->
  <text class="mono" x="952" y="96" font-size="11.5" fill="#8090B8" text-anchor="end">o que est&#225; no ar</text>

  <circle class="pulse" cx="644" cy="126" r="4" fill="#2BD9A0"/>
  <circle cx="644" cy="126" r="4" fill="#2BD9A0"/>
  <text class="mono" x="660" y="131" font-size="14" fill="#E8EDFF">enfermex</text>
  <text class="mono" x="952" y="131" font-size="12" fill="#8090B8" text-anchor="end">gest&#227;o de pacientes</text>
  <line x1="640" y1="146" x2="952" y2="146" stroke="#1E2A4E" stroke-width="1"/>

  <circle cx="644" cy="170" r="4" fill="#446DF7"/>
  <text class="mono" x="660" y="175" font-size="14" fill="#E8EDFF">mv vidros</text>
  <text class="mono" x="952" y="175" font-size="12" fill="#8090B8" text-anchor="end">or&#231;amentos automatizados</text>

  <!-- borda -->
  <rect x="8.75" y="8.75" width="982.5" height="232.5" rx="17.25"
        fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
